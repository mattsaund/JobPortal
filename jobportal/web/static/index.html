<!doctype html>
<!-- index.html: the dashboard's one page, served by web/server.py. It holds the frame (the sidebar, the top bar and an
     empty <main>) and loads the plain scripts in js/ in order; they draw every page into <main> by the address after #
     (js/layout.js) and talk to the server's /api/. See "How it works" in CONTRIBUTING.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPortal</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<!-- Restore the light or dark theme (Settings, Appearance) before the page paints, so it never flashes the other one. -->
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem("jobportal-theme") === "dark" ? "dark" : "light";
  } catch (_) {
    document.documentElement.dataset.theme = "light";
  }
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<!-- The frame. js/layout.js fills in the sidebar and the top bar; every page draws itself inside <main>. -->
<div class="app-shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/home" aria-label="JobPortal home"><img src="/static/logo.png" alt="JobPortal" width="640" height="205"></a>
    <nav id="navigation" aria-label="Pages"></nav>
    <div class="sidebar-bottom">
      <div class="next-step" id="next-step" aria-live="polite"></div>
      <a class="nav-item" id="nav-settings" href="#/settings"></a>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <label class="search-box" id="search-box"></label>
      <div class="top-actions">
        <div class="run-control" id="run-control"></div>
        <a class="user-button" id="user-button" href="#/settings"></a>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<!-- Plain scripts that share one global scope, loaded in this order. Code that runs at load time may only use names from
     files above it; calls inside functions can reach any file. main.js starts the app, so it stays last. -->
<script src="/static/js/core.js"></script>
<script src="/static/js/live.js"></script>
<script src="/static/js/layout.js"></script>
<script src="/static/js/components/file-drops.js"></script>
<script src="/static/js/components/search-area.js"></script>
<script src="/static/js/components/answers-form.js"></script>
<script src="/static/js/components/settings-form.js"></script>
<script src="/static/js/components/documents.js"></script>
<script src="/static/js/pages/home.js"></script>
<script src="/static/js/pages/leads.js"></script>
<script src="/static/js/pages/lead.js"></script>
<script src="/static/js/pages/sources.js"></script>
<script src="/static/js/pages/tracker.js"></script>
<script src="/static/js/pages/analysis.js"></script>
<script src="/static/js/pages/settings.js"></script>
<script src="/static/js/pages/profile.js"></script>
<script src="/static/js/pages/dreams.js"></script>
<script src="/static/js/pages/resumes.js"></script>
<script src="/static/js/pages/runs.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
