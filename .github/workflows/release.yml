name: Release

# Code signing turns on by itself once the certificates are repository secrets (CONTRIBUTING.md, Releases):
#   Windows: WINDOWS_CERT_PFX (the .pfx file in base64) and WINDOWS_CERT_PASSWORD
#   macOS: MACOS_CERT_P12 (the Developer ID certificate in base64), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#          APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (for notarizing)
# Without them the apps build unsigned, which is why each system warns on the first open.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each Mac build runs on a runner of its own kind: PyInstaller builds for the machine it runs on. GitHub keeps its
        # Intel Mac runner (macos-15-intel) until fall 2027, when Apple Silicon is the only Mac left to build for.
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS, pdf_engine: mac-arm64, dmg: JobPortal-macOS.dmg }
          - { os: macos-15-intel, name: macOS-Intel, pdf_engine: mac-x64, dmg: JobPortal-macOS-Intel.dmg }
          - { os: ubuntu-22.04, name: Linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean packaging/jobportal.spec
      # macOS and Linux don't come with a Chromium browser, so their apps carry their own PDF engine. Windows has Edge.
      - name: Bundle the PDF engine (macOS)
        if: runner.os == 'macOS'
        run: |
          python packaging/fetch_pdf_engine.py ${{ matrix.pdf_engine }} dist/JobPortal.app/Contents/Resources/pdf-engine
      - name: Sign the app (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            codesign --force --sign - dist/JobPortal.app  # unsigned builds still need an ad hoc signature to run
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p temp "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Inside out: every library and program first, then the app around them.
          find dist/JobPortal.app/Contents -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 |
            xargs -0 -I{} sh -c 'file -b "$1" | grep -q Mach-O && codesign --force --options runtime --timestamp --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "$1" || true' _ {}
          codesign --force --options runtime --timestamp --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/JobPortal.app
          codesign --verify --strict --verbose=2 dist/JobPortal.app
      - name: Bundle the PDF engine (Linux)
        if: runner.os == 'Linux'
        run: python packaging/fetch_pdf_engine.py linux64 dist/JobPortal/pdf-engine
      - name: Smoke test
        shell: bash
        env:
          JOBPORTAL_HOME: ${{ runner.temp }}/jobportal-smoke
        run: |
          case "$RUNNER_OS" in
            Windows) BIN=dist/JobPortal/JobPortal.exe ;;
            macOS) BIN=dist/JobPortal.app/Contents/MacOS/JobPortal ;;
            *) BIN=dist/JobPortal/JobPortal ;;
          esac
          if [ "$RUNNER_OS" != "Windows" ]; then "$BIN" --doctor | grep "PDF export" | grep -q "built in"; fi
          "$BIN" --server --port 8795 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8795/api/meta > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8795/api/meta | grep -q '"pdf_ready":true'
          curl -sf http://127.0.0.1:8795/ | grep -q JobPortal
          # Print a resume to PDF the way a user would: save one to the library, then export it.
          ID=$(curl -sf -X POST http://127.0.0.1:8795/api/library -H 'content-type: application/json' \
            -d '{"name": "Smoke test", "md": "# Jordan Rivera\njordan.rivera@example.com\n\n## Experience\n- Closed 40+ tickets a week"}' \
            | python -c "import json, sys; print(json.load(sys.stdin)['id'])")
          curl -sf -o smoke.pdf "http://127.0.0.1:8795/api/library/$ID/export/pdf"
          head -c 5 smoke.pdf | grep -q "%PDF"
          "$BIN" --stop --port 8795 || true
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          function Sign($file) {
            if (-not $env:WINDOWS_CERT_PFX) { return }
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $tool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if ($env:WINDOWS_CERT_PFX) { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)) }
          Sign dist\JobPortal\JobPortal.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import jobportal; print(jobportal.__version__)"
          & $iscc "/DAppVersion=$version" packaging\windows\jobportal.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Sign out\JobPortal-Windows-Setup.exe
          if (Test-Path $pfx) { Remove-Item $pfx }
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JOBPORTAL_HOME: ${{ runner.temp }}\jobportal-installed
        run: |
          Start-Process -Wait -FilePath out\JobPortal-Windows-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $exe = "$env:LOCALAPPDATA\Programs\JobPortal\JobPortal.exe"
          if (-not (Test-Path $exe)) { throw "JobPortal.exe wasn't installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JobPortal.lnk")) { throw "no Start menu shortcut" }
          Start-Process -FilePath $exe -ArgumentList "--server", "--port", "8796"
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8796/api/meta | Out-Null; $up = $true } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw "the installed app didn't start" }
          Start-Process -Wait -FilePath $exe -ArgumentList "--stop", "--port", "8796"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          ditto dist/JobPortal.app dmg/JobPortal.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname JobPortal -srcfolder dmg -ov -format UDZO out/${{ matrix.dmg }}
      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$APPLE_ID" ]; then exit 0; fi
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" out/${{ matrix.dmg }}
          xcrun notarytool submit out/${{ matrix.dmg }} --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple out/${{ matrix.dmg }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out JobPortal.AppDir/usr/bin
          cp -r dist/JobPortal JobPortal.AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/JobPortal/JobPortal" "$@"\n' > JobPortal.AppDir/AppRun
          chmod +x JobPortal.AppDir/AppRun
          cp packaging/icons/jobportal.png JobPortal.AppDir/jobportal.png
          ln -s jobportal.png JobPortal.AppDir/.DirIcon
          sed 's|@EXEC@|JobPortal|' jobportal/resources/jobportal.desktop > JobPortal.AppDir/jobportal.desktop
          curl -sfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool JobPortal.AppDir out/JobPortal-Linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./out/JobPortal-Linux-x86_64.AppImage --version | grep -q JobPortal
      - uses: actions/upload-artifact@v4
        with:
          name: JobPortal-${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "JobPortal ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md
