name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean packaging/jobportal.spec
      # macOS and Linux don't come with a Chromium browser, so their apps carry their own PDF engine. Windows has Edge.
      - name: Bundle the PDF engine (macOS)
        if: runner.os == 'macOS'
        run: |
          python packaging/fetch_pdf_engine.py mac-arm64 dist/JobPortal.app/Contents/Resources/pdf-engine
          codesign --force --sign - dist/JobPortal.app
      - name: Bundle the PDF engine (Linux)
        if: runner.os == 'Linux'
        run: python packaging/fetch_pdf_engine.py linux64 dist/JobPortal/pdf-engine
      - name: Smoke test
        shell: bash
        env:
          JOBPORTAL_HOME: ${{ runner.temp }}/jobportal-smoke
        run: |
          case "$RUNNER_OS" in
            Windows) BIN=dist/JobPortal/JobPortal.exe ;;
            macOS) BIN=dist/JobPortal.app/Contents/MacOS/JobPortal ;;
            *) BIN=dist/JobPortal/JobPortal ;;
          esac
          if [ "$RUNNER_OS" != "Windows" ]; then "$BIN" --doctor | grep "PDF export" | grep -q "built in"; fi
          "$BIN" --server --port 8795 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8795/api/meta > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8795/api/meta | grep -q '"pdf_ready":true'
          curl -sf http://127.0.0.1:8795/ | grep -q JobPortal
          # Print a resume to PDF the way a user would: save one to the library, then export it.
          ID=$(curl -sf -X POST http://127.0.0.1:8795/api/library -H 'content-type: application/json' \
            -d '{"name": "Smoke test", "md": "# Jordan Rivera\njordan.rivera@example.com\n\n## Experience\n- Closed 40+ tickets a week"}' \
            | python -c "import json, sys; print(json.load(sys.stdin)['id'])")
          curl -sf -o smoke.pdf "http://127.0.0.1:8795/api/library/$ID/export/pdf"
          head -c 5 smoke.pdf | grep -q "%PDF"
          "$BIN" --stop --port 8795 || true
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import jobportal; print(jobportal.__version__)"
          & $iscc "/DAppVersion=$version" packaging\windows\jobportal.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JOBPORTAL_HOME: ${{ runner.temp }}\jobportal-installed
        run: |
          Start-Process -Wait -FilePath out\JobPortal-Windows-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $exe = "$env:LOCALAPPDATA\Programs\JobPortal\JobPortal.exe"
          if (-not (Test-Path $exe)) { throw "JobPortal.exe wasn't installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JobPortal.lnk")) { throw "no Start menu shortcut" }
          Start-Process -FilePath $exe -ArgumentList "--server", "--port", "8796"
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8796/api/meta | Out-Null; $up = $true } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw "the installed app didn't start" }
          Start-Process -Wait -FilePath $exe -ArgumentList "--stop", "--port", "8796"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          ditto dist/JobPortal.app dmg/JobPortal.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname JobPortal -srcfolder dmg -ov -format UDZO out/JobPortal-macOS.dmg
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out JobPortal.AppDir/usr/bin
          cp -r dist/JobPortal JobPortal.AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/JobPortal/JobPortal" "$@"\n' > JobPortal.AppDir/AppRun
          chmod +x JobPortal.AppDir/AppRun
          cp packaging/icons/jobportal.png JobPortal.AppDir/jobportal.png
          ln -s jobportal.png JobPortal.AppDir/.DirIcon
          sed 's|@EXEC@|JobPortal|' jobportal/resources/jobportal.desktop > JobPortal.AppDir/jobportal.desktop
          curl -sfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool JobPortal.AppDir out/JobPortal-Linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./out/JobPortal-Linux-x86_64.AppImage --version | grep -q JobPortal
      - uses: actions/upload-artifact@v4
        with:
          name: JobPortal-${{ runner.os }}
          path: out/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "JobPortal ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md
