name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Doctor
        run: python -m jobportal --doctor
      - name: Server smoke test
        shell: bash
        env:
          JOBPORTAL_HOME: ${{ runner.temp }}/jobportal-smoke
        run: |
          python -m jobportal --background --port 8790
          curl -sf http://127.0.0.1:8790/api/meta
          curl -sf http://127.0.0.1:8790/ | grep -q JobPortal
          python -m jobportal --stop --port 8790

  launchers:
    name: launcher on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run.sh (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./run.sh --version
      - name: run.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run.ps1 --version
