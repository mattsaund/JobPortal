# The writing rules (tests/test_writing.py): no em dashes, no middle dots as separators, American spelling. CI skips pushes
# that only change Markdown or documentation/, so this small check runs on every push and pull request instead.
name: Writing rules

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  writing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check the writing rules
        run: python -m pytest -q tests/test_writing.py
