[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobportal"
dynamic = ["version"]
description = "Import your resume, answer the standard job questions, and JobPortal hunts for jobs and prepares every application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "mattsaund" }]
keywords = ["jobs", "resume", "job-search", "chatgpt", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "platformdirs>=4.2",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]
qt = ["pywebview[qt]>=5.0"]

[project.scripts]
jobportal = "jobportal.app.cli:main"

[project.urls]
Repository = "https://github.com/mattsaund/JobPortal"

[tool.setuptools.dynamic]
version = { attr = "jobportal.__version__" }

[tool.setuptools.packages.find]
include = ["jobportal*"]

[tool.setuptools.package-data]
jobportal = ["resources/*"]
"jobportal.web" = ["static/*", "static/fonts/*", "static/js/*", "static/js/components/*", "static/js/pages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:uvicorn.*", "ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B006", "B008", "I"]
ignore = ["E501", "E731", "E741", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["jobportal"]
combine-as-imports = true
